<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Litoral Lab · Contenidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#F5FAFD; --surface:#FFFFFF; --ink:#0B2E47; --muted:#4E6577; --line:#CFE3EF;
  --celeste:#E3F3FB; --celeste2:#8FCDEB; --azul:#1F7FB8; --profundo:#032C75; --doppler:#0F6E7A;
  --display:"Montserrat",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 64px;display:grid;gap:20px}
header{display:grid;gap:10px}
.waves{height:16px;background:repeating-radial-gradient(circle at 0 100%,transparent 0 6px,var(--celeste2) 6px 8px);border-radius:4px;opacity:.9}
h1{font:800 clamp(2rem,6vw,2.9rem)/1 var(--display);margin:0;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--azul)}
.sub{color:var(--muted);margin:0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;font-variant-numeric:tabular-nums}
.stat b{font:800 1.4rem var(--display);display:block}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
nav{display:flex;gap:6px;border-bottom:2px solid var(--profundo);flex-wrap:wrap}
nav button{font:700 1rem var(--display);background:none;border:0;color:var(--muted);padding:9px 16px;border-radius:10px 10px 0 0;cursor:pointer;min-height:44px}
nav button[aria-selected="true"]{background:var(--profundo);color:#fff}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.btn{background:var(--profundo);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--profundo)}
.btn.sm{font-size:.82rem;padding:5px 12px;min-height:34px}
.note{color:var(--muted);font-size:.92rem}
.list{display:grid;gap:18px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.pill{font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor}
.pill.doppler{color:var(--doppler)}
.pill.eco{color:var(--azul)}
.pill.borrador{color:var(--muted)}
.pill.validar{background:#FFF1C9;color:#6A4A00;border-color:#6A4A00}
.pill.aprobado{color:#1E6B3A}
.pill.publicado{background:var(--profundo);color:#fff;border-color:var(--profundo)}
h3{font:800 1.3rem/1.2 var(--display);margin:0}
.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.gallery figure{margin:0;flex:0 0 auto;scroll-snap-align:start;display:grid;gap:6px;justify-items:start}
.gallery img{display:block;height:340px;width:auto;border-radius:10px;border:1px solid var(--line);background:var(--celeste)}
.gallery.reel img{height:380px}
.gallery figcaption{font-size:.78rem;color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;min-height:32px}
.block{display:grid;gap:4px;margin-top:10px;min-width:0}
.lbl{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.code{font-size:.95rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.val{background:#FFF8E1;border:1px solid #E9D48F;border-radius:10px;padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.metrics input{width:100%;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
@media (max-width:560px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery img{height:300px}.gallery.reel img{height:340px}}
select{padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);min-height:38px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
.bible{display:grid;gap:14px}
.bible section{background:var(--surface);border-radius:16px;padding:18px;border:1.5px solid var(--line)}
.bible h2{font:800 1.25rem var(--display);margin:0 0 6px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw div{display:grid;gap:4px;font-size:.8rem}
.sw i{display:block;width:64px;height:40px;border-radius:8px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--profundo);color:#fff;padding:8px 18px;border-radius:999px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="waves" aria-hidden="true"></div>
    <h1>Litoral <em>Lab</em></h1>
    <p class="sub">El tablero de contenidos de @litoralimagenes. Acá llegan las piezas listas: placas y cuadros de reel para guardar y subir, el texto del posteo, el estado de validación con Matías y cómo le fue a cada una.</p>
    <div class="stats" id="stats"></div>
  </header>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-view="piezas">Piezas</button>
    <button role="tab" aria-selected="false" data-view="biblia">Biblia</button>
  </nav>

  <main id="view-piezas">
    <p class="note" id="status">Cargando piezas…</p>
    <div class="list" id="list"></div>
  </main>
  <main id="view-biblia" hidden><div class="bible" id="bible"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

const logoReady=Promise.all(Object.values(LOGO).map(i=>i.decode().catch(()=>{})));
function logo(ctx,x,y,h,dark){const im=dark?LOGO.white:LOGO.navy;if(im.naturalWidth){ctx.drawImage(im,x,y,im.naturalWidth*h/im.naturalHeight,h)}else{ctx.font=font(800,30,"d");ctx.fillStyle=dark?"#fff":C.profundo;ctx.fillText("LITORAL",x,y+h*.7)}}
const cache=new Map();

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copiado")}catch(e){toast("No se pudo copiar")}}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["piezas","biblia"].forEach(v=>$("#view-"+v).hidden=v!==b.dataset.view);
});

/* ---------- Dibujo de placas ---------- */
function font(w,s,fam){return `${w} ${s}px ${fam==="d"?"Montserrat":"'Atkinson Hyperlegible'"}`}
function wrap(ctx,text,maxW){
  const out=[];String(text||"").split("\n").forEach(par=>{
    let line="";par.split(" ").forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});
  return out;
}
function textBlock(ctx,text,x,y,maxW,size,lh,weight,fam,color){
  ctx.font=font(weight,size,fam);ctx.fillStyle=color;
  const lines=wrap(ctx,text,maxW);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*size*lh));
  return y+lines.length*size*lh;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function waves(ctx,cx,cy,n,color,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=6;for(let i=1;i<=n;i++){ctx.beginPath();ctx.arc(cx,cy,i*70,Math.PI*1.05,Math.PI*1.95);ctx.stroke()}ctx.restore()}
function head(ctx,W,area,dark){
  logo(ctx,80,62,76,dark);
  const tag=area==="doppler"?"DOPPLER":"ECOGRAFÍA";ctx.font=font(800,26,"d");
  const tw=ctx.measureText(tag).width+44;const col=dark?"#fff":(area==="doppler"?C.doppler:C.azul);
  ctx.strokeStyle=col;ctx.lineWidth=3;rr(ctx,W-80-tw,74,tw,52,26);ctx.stroke();ctx.fillStyle=col;ctx.fillText(tag,W-80-tw+22,110);
}
function foot(ctx,W,H,i,n,dark){
  ctx.font=font(700,28,"b");ctx.fillStyle=dark?"#CFE3EF":C.muted;ctx.fillText("@litoralimagenes",80,H-80);
  if(n>1){for(let k=0;k<n;k++){ctx.beginPath();ctx.arc(W-80-(n-1-k)*30,H-90,k===i?9:6,0,7);ctx.fillStyle=dark?(k===i?"#fff":"#5C7C94"):(k===i?C.profundo:C.celeste2);ctx.fill()}}
}
function drawPlaca(p,i,n,area){
  const W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
  const tipo=p.tipo||"info";const dark=tipo==="cierre";
  const bg=dark?C.profundo:(tipo==="portada"?C.celeste:(i%2?C.blanco:C.celeste));
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  head(ctx,W,area,dark);
  if(tipo==="portada"){
    waves(ctx,W+40,H+60,8,area==="doppler"?C.doppler:C.azul,.18);
    let y=420;
    if(p.etiqueta){ctx.font=font(700,34,"b");ctx.fillStyle=area==="doppler"?C.doppler:C.azul;ctx.fillText(p.etiqueta.toUpperCase(),80,y);y+=70}
    y=textBlock(ctx,p.titulo,80,y+40,880,104,1.05,800,"d",C.profundo);
    if(p.texto){y=textBlock(ctx,p.texto,80,y+40,820,46,1.3,400,"b",C.ink)}
    ctx.fillStyle=area==="doppler"?C.doppler:C.azul;rr(ctx,80,y+40,140,12,6);ctx.fill();
  }else if(tipo==="cierre"){
    waves(ctx,W+40,H+60,8,"#ffffff",.12);
    let y=textBlock(ctx,p.titulo||"Pedí tu turno",80,330,900,92,1.08,800,"d","#fff")+30;
    (p.items||[]).forEach(it=>{ctx.fillStyle=C.celeste2;rr(ctx,80,y-30,14,14,7);ctx.fill();y=textBlock(ctx,it,124,y,860,40,1.3,400,"b","#fff")+26});
    if(p.texto){y+=20;ctx.fillStyle="#fff";rr(ctx,80,y,920,128,64);ctx.fill();ctx.font=font(800,38,"d");ctx.fillStyle=C.profundo;
      const w=ctx.measureText(p.texto).width;ctx.fillText(p.texto,80+(920-w)/2,y+78)}
  }else{
    const box=i%2?C.celeste:C.blanco;
    ctx.fillStyle=box;rr(ctx,60,230,W-120,H-400,36);ctx.fill();
    let y=360;
    ctx.font=font(700,30,"b");ctx.fillStyle=C.muted;ctx.fillText(String(i+1).padStart(2,"0")+" / "+String(n).padStart(2,"0"),120,y);
    y=textBlock(ctx,p.titulo,120,y+90,840,76,1.1,800,"d",C.profundo)+30;
    if(tipo==="lista"){
      (p.items||[]).forEach(it=>{
        const pend=/\[.*\]/.test(it);
        ctx.beginPath();ctx.arc(146,y-14,24,0,7);ctx.fillStyle=area==="doppler"?C.doppler:C.azul;ctx.fill();
        ctx.strokeStyle="#fff";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(134,y-14);ctx.lineTo(143,y-4);ctx.lineTo(160,y-26);ctx.stroke();
        y=textBlock(ctx,it,196,y,760,44,1.3,pend?700:400,"b",pend?"#9A5B00":C.ink)+30;
      });
    }else{y=textBlock(ctx,p.texto,120,y,840,48,1.35,400,"b",C.ink)}
  }
  foot(ctx,W,H,i,n,dark);
  return cv.toDataURL("image/png");
}
/* ---------- Dibujo de cuadros de reel (9:16) ---------- */
function vaso(ctx,cx,cy,etapa){
  const L=760,h=200,x0=cx-L/2;
  ctx.fillStyle="#FDEDEA";rr(ctx,x0,cy-h/2,L,h,100);ctx.fill();
  ctx.strokeStyle=C.profundo;ctx.lineWidth=14;rr(ctx,x0,cy-h/2,L,h,100);ctx.stroke();
  const placa=etapa==="placa"?60:(etapa==="estrecha"||etapa==="fragmento")?120:0;
  if(placa){ctx.fillStyle=C.placa;ctx.beginPath();ctx.ellipse(cx,cy-h/2+7,180,placa,0,0,Math.PI);ctx.fill();ctx.strokeStyle="#B8891F";ctx.lineWidth=5;ctx.stroke()}
  const flecha=(x,y,s)=>{ctx.fillStyle=C.sangre;ctx.beginPath();ctx.moveTo(x,y-14*s);ctx.lineTo(x+30*s,y);ctx.lineTo(x,y+14*s);ctx.closePath();ctx.fill();ctx.fillRect(x-50*s,y-6*s,50*s,12*s)};
  const fy=placa>80?cy+50:cy+10;
  [x0+130,cx-20,x0+L-140].forEach(x=>flecha(x,fy,1.3));
  if(etapa==="fragmento"){ctx.fillStyle=C.placa;ctx.beginPath();ctx.arc(x0+L+70,cy-160,30,0,7);ctx.fill();
    ctx.strokeStyle=C.sangre;ctx.lineWidth=8;ctx.setLineDash([18,14]);ctx.beginPath();ctx.moveTo(cx+190,cy-60);ctx.quadraticCurveTo(x0+L+20,cy-40,x0+L+60,cy-120);ctx.stroke();ctx.setLineDash([])}
  ctx.font=font(700,34,"b");ctx.fillStyle=C.muted;ctx.fillText("Arteria carótida (esquema)",x0,cy+h/2+70);
}
function drawFrame(f,i,n,area){
  const W=1080,H=1920,cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
  const dark=f.visual==="cierre";
  ctx.fillStyle=dark?C.profundo:C.celeste;ctx.fillRect(0,0,W,H);
  logo(ctx,80,100,80,dark);
  if(dark){logo(ctx,(W-640)/2,430,196,true)}
  if(!dark){ctx.fillStyle="#fff";ctx.font=font(800,62,"d");const lines=wrap(ctx,f.texto,820);const bh=lines.length*76+90;rr(ctx,80,260,920,bh,32);ctx.fill();
    lines.forEach((l,k)=>{ctx.fillStyle=C.profundo;ctx.fillText(l,125,345+k*76)});}
  const v=f.visual;
  if(["vaso","placa","estrecha","fragmento"].includes(v)){vaso(ctx,W/2,1150,v)}
  else if(v==="factores"){
    const fs=f.items||[];let y=900;fs.forEach(t=>{ctx.fillStyle="#fff";rr(ctx,140,y,800,120,60);ctx.fill();ctx.beginPath();ctx.arc(210,y+60,26,0,7);ctx.fillStyle=C.doppler;ctx.fill();
      ctx.font=font(700,46,"b");ctx.fillStyle=C.ink;ctx.fillText(t,264,y+76);y+=150});
  }else if(dark){
    waves(ctx,W/2,H+200,10,"#ffffff",.12);
    let y=textBlock(ctx,f.texto,100,760,880,80,1.12,800,"d","#fff")+60;
    ctx.fillStyle="#fff";rr(ctx,100,y,880,130,65);ctx.fill();ctx.font=font(800,40,"d");ctx.fillStyle=C.profundo;
    const cta=f.cta||"Turnos por WhatsApp · link en la bio";const w=ctx.measureText(cta).width;ctx.fillText(cta,100+(880-w)/2,y+80);
  }
  ctx.font=font(700,28,"b");ctx.fillStyle=dark?"#CFE3EF":C.muted;ctx.fillText("@litoralimagenes",80,H-140);
  return cv.toDataURL("image/png");
}
async function imagenes(p){
  const key="v2|"+p.id+"|"+(p.version||"")+"|"+JSON.stringify(p.placas||p.escenas||[]);
  if(cache.has(key))return cache.get(key);
  await logoReady;await Promise.all(["800 40px Montserrat","700 40px Montserrat","400 40px 'Atkinson Hyperlegible'","700 40px 'Atkinson Hyperlegible'"].map(f=>document.fonts.load(f).catch(()=>{})));
  const area=p.area||"eco";
  const imgs=p.formato==="reel"?(p.escenas||[]).map((f,i,a)=>drawFrame(f,i,a.length,area)):(p.placas||[]).map((x,i,a)=>drawPlaca(x,i,a.length,area));
  cache.set(key,imgs);return imgs;
}

/* ---------- Render ---------- */
const num=v=>Number(v)||0;
function renderStats(){
  const pub=piezas.filter(g=>g.estado==="publicado");const s=k=>pub.reduce((a,g)=>a+num(g[k]),0);
  $("#stats").innerHTML=[["Piezas",piezas.length],["Para validar",piezas.filter(g=>g.estado==="validar").length],["Publicadas",pub.length],["Guardados",s("guardados")],["Toques WhatsApp",s("whatsapp")]]
    .map(([l,v])=>`<div class="stat"><b>${v.toLocaleString("es-AR")}</b><span>${l}</span></div>`).join("");
}
async function renderList(){
  const list=$("#list");
  if(!piezas.length){list.innerHTML=`<div class="empty"><p><b>Todavía no hay piezas.</b></p><p>Cuando el agente de contenido arma una pieza, aparece acá con sus imágenes.</p></div>`;return}
  const sorted=[...piezas].sort((a,b)=>(a.orden??99)-(b.orden??99)||(a.fecha||"").localeCompare(b.fecha||""));
  list.innerHTML=sorted.map(g=>`
  <article class="card" data-id="${esc(g.id)}">
    <div class="meta"><span class="pill ${esc(g.estado||"borrador")}">${ESTADOS[g.estado]||"Borrador"}</span><span class="pill ${g.area==="doppler"?"doppler":"eco"}">${g.area==="doppler"?"Doppler":"Ecografía"}</span><span>${esc(g.semana?("Semana "+g.semana):"")} · ${g.formato==="reel"?"Reel":g.formato==="historia"?"Historia":"Carrusel"}</span></div>
    <h3>${esc(g.titulo)}</h3>
    <div class="gallery ${g.formato==="reel"?"reel":""}" aria-label="Imágenes de la pieza"><p class="note">Dibujando…</p></div>
    <p class="note">Tocá «Guardar» debajo de cada imagen para bajarla y subirla a Instagram.</p>
    ${g.validar?`<div class="val"><span class="lbl">A confirmar con Matías</span><p class="pre">${esc(g.validar)}</p></div>`:""}
    <details><summary>Texto del posteo, guion y horario</summary>
      ${g.caption?`<div class="block"><div class="row" style="justify-content:space-between"><span class="lbl">Texto del posteo</span><button class="btn ghost sm" data-act="caption">Copiar</button></div><div class="code">${esc(g.caption)}${g.hashtags?"\n\n"+esc(g.hashtags):""}</div></div>`:""}
      ${g.guion?`<div class="block"><span class="lbl">Cómo armar el reel</span><p class="pre">${esc(g.guion)}</p></div>`:""}
      ${g.horario?`<div class="block"><span class="lbl">Cuándo publicar</span><p class="pre">${esc(g.horario)}</p></div>`:""}
      ${g.historias?`<div class="block"><span class="lbl">Historias</span><p class="pre">${esc(g.historias)}</p></div>`:""}
    </details>
    <div class="row"><label class="lbl" for="st-${esc(g.id)}">Estado</label>
      <select id="st-${esc(g.id)}" data-field="estado">${Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}" ${g.estado===k?"selected":""}>${v}</option>`).join("")}</select></div>
    <div><span class="lbl">Resultados a los 7 días</span>
      <div class="metrics">${METRICAS.map(k=>`<label><span class="note" style="font-size:.78rem">${MLABEL[k]}</span><input type="number" min="0" inputmode="numeric" data-field="${k}" value="${g[k]??""}"></label>`).join("")}</div>
    </div>
  </article>`).join("");
  for(const g of sorted){
    const el=list.querySelector(`[data-id="${CSS.escape(g.id)}"] .gallery`);if(!el)continue;
    const imgs=await imagenes(g);
    el.innerHTML=imgs.map((src,i)=>`<figure><img src="${src}" alt="${esc(g.titulo)} · ${g.formato==="reel"?"escena":"placa"} ${i+1}"><figcaption class="row">${g.formato==="reel"?"Escena":"Placa"} ${i+1} <button class="btn ghost sm" data-act="bajar" data-i="${i}">Guardar</button></figcaption></figure>`).join("");
  }
}
$("#list").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const g=piezas.find(x=>x.id===b.closest(".card").dataset.id);if(!g)return;
  if(b.dataset.act==="caption")return copy(g.caption+(g.hashtags?"\n\n"+g.hashtags:""));
  const imgs=await imagenes(g);const i=num(b.dataset.i);
  const dl=await window.claude?.use?.("downloads");
  if(!dl){toast("Para guardar, abrí el tablero desde Claude");return}
  try{const bin=atob(imgs[i].split(",")[1]);const u8=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);const blob=new Blob([u8],{type:"image/png"});
    await dl.save({filename:`litoral-${g.id}-${String(i+1).padStart(2,"0")}.png`,data:blob});toast("Listo")}
  catch(err){if(err?.code!=="declined")toast("No se pudo guardar")}
});
$("#list").addEventListener("change",async e=>{
  const f=e.target.dataset.field;if(!f||!db)return;
  const id=e.target.closest(".card").dataset.id;
  const val=f==="estado"?e.target.value:(e.target.value===""?null:num(e.target.value));
  try{await db.doc("piezas/"+id).update({[f]:val});toast("Guardado")}catch(err){toast("No se pudo guardar")}
});

function renderBiblia(){
  if(!biblia){$("#bible").innerHTML=`<div class="empty">La biblia todavía no está cargada.</div>`;return}
  const sec=(t,b)=>b?`<section><h2>${t}</h2><p class="pre">${esc(b)}</p></section>`:"";
  $("#bible").innerHTML=`
    <section><h2>Paleta</h2><div class="sw">${[["Blanco","#FFFFFF"],["Celeste suave","#E3F3FB"],["Celeste","#8FCDEB"],["Azul","#1F7FB8"],["Azul Litoral (logo)","#032C75"],["Doppler","#0F6E7A"]].map(([n,h])=>`<div><i style="background:${h}"></i>${n}<br><span class="note">${h}</span></div>`).join("")}</div></section>
    ${sec("Datos fijos",biblia.datos)}${sec("Reglas médicas",biblia.reglas)}${sec("Formatos",biblia.formatos)}${sec("Orden de temas",biblia.orden)}`;
}

(async()=>{
  db=await window.claude?.use?.("db");
  if(!db){$("#status").textContent="Abrí el tablero desde Claude para ver y guardar las piezas.";renderList();renderStats();renderBiblia();return}
  const timer=setTimeout(()=>$("#status").textContent="No pude conectarme todavía con la base. Reintento solo.",10000);
  let first=true;
  db.collection("piezas").onSnapshot(s=>{
    clearTimeout(timer);
    piezas=s.docs.map(d=>({id:d.id,version:d.version,...d.data()}));
    $("#status").textContent=`${piezas.length} pieza${piezas.length===1?"":"s"}`;
    if(first||!document.activeElement?.closest?.(".card")){first=false;renderList()}
    renderStats();
  },()=>{clearTimeout(timer);$("#status").textContent="No se pudieron cargar las piezas."});
  db.doc("biblia/principal").onSnapshot(s=>{biblia=s.exists?s.data():null;renderBiblia()},()=>{});
})();
</script>
